<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Arts Club Checker</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
 
    <style>
        :root {
            --black: #111111;
            --paper: #efe6d6;
            --blue: #2b5fae;
            --yellow: #eda92b;
            --red: #d63a2f;
        }
 
        body {
            background-color: var(--black);
            background-image: url(comarts.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: var(--paper);
        }
 
        .card-box {
            max-width: 420px;
            background-color: var(--paper);
            border: 3px solid var(--black);
            border-radius: 12px;
            box-shadow: 8px 8px 0 var(--yellow);
            padding: 30px;
        }
 
        .title {
            color: var(--blue);
            font-weight: bold;
            text-align: center;
        }
 
        .subtitle {
            color: var(--red);
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: bold;
        }
 
        .form-control {
            background-color: #ffffff;
            border: 2px solid var(--black);
            color: var(--black);
        }
 
        .form-control:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 0.2rem rgba(43, 95, 174, 0.35);
        }
 
        .btn-main {
            background-color: var(--yellow);
            border: 2px solid var(--black);
            color: var(--black);
            font-weight: bold;
        }
 
        .btn-main:hover {
            background-color: var(--red);
            color: #ffffff;
        }
 
        #message {
            position: relative;
            background-color: var(--blue);
            color: #ffffff;
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            min-height: 30px;
        }
 
        #message::before {
            content: "";
            position: absolute;
            top: -12px;
            left: 40px;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 14px solid var(--blue);
        }
 
        footer {
            text-align: center;
            color: var(--paper);
            font-size: 0.8rem;
        }
 
        footer span {
            color: var(--yellow);
        }
    </style>
</head>
<body class="container pt-5">
 
    <div class="card-box mx-auto">
        <h1 class="title h3">COMMUNICATION ARTS CLUB</h1>
        <p class="subtitle">CANDIDATE VERIFICATION SYSTEM</p>
 
      
        <input type="text" id="first_name" class="form-control mb-3" placeholder="First Name">
        <input type="text" id="last_name" class="form-control mb-3" placeholder="Last Name">
 
        <button type="button" class="btn btn-main w-100" py-click="check_candidate">ENTER</button>
    </div>
 
    <div class="mx-auto mt-4" style="max-width: 420px;">
        <div id="message">Enter your name to check.</div>
    </div>
 
    <footer class="mt-5">&copy; 2026 <span>Communication Arts Club</span> &bull; Seatwork 1 &bull; 2nd Quarter</footer>
 
    <py-script src="main.py"></py-script>
 
</body>
</html>
